name: Auto-Update Trek

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier et mettre à jour Trek
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/mauriceboe/trek/releases/latest | jq -r .tag_name)
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" == "null" ]; then
            echo "Impossible de récupérer le dernier tag"
            exit 0
          fi

          CLEAN_VERSION="${LATEST_TAG#v}"
          CURRENT_VERSION=$(grep '^version:' trek/umbrel-app.yml | sed -E 's/version: "(.*)"/\1/')

          if [ "$CLEAN_VERSION" != "$CURRENT_VERSION" ]; then
            echo "Nouvelle version détectée : $LATEST_TAG"
            docker pull "mauriceboe/trek:${LATEST_TAG}"
            DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "mauriceboe/trek:${LATEST_TAG}" | cut -d'@' -f2)

            sed -i "s/^version: .*/version: \"${CLEAN_VERSION}\"/" trek/umbrel-app.yml
            sed -i "s|image: mauriceboe/trek:.*|image: mauriceboe/trek:${LATEST_TAG}@${DIGEST}|" trek/docker-compose.yml
            sed -i "s/Mise à jour vers la version .*/Mise à jour vers la version ${CLEAN_VERSION}./" trek/umbrel-app.yml

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add trek/umbrel-app.yml trek/docker-compose.yml
            git commit -m "Update Trek to ${LATEST_TAG}"
            git push
          else
            echo "Trek est déjà à jour ($CURRENT_VERSION)"
          fi