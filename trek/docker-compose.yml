version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: trek_web_1
      APP_PORT: 3000

  web:
    image: mauriceboe/trek:v5.2.1@sha256:7935eeb96db3202b5af896951fd96379d6eb4d3608ce93a1f2e8f850e10a2257
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
      - ${APP_DATA_DIR}/uploads:/app/uploads
    environment:
      NODE_ENV: production